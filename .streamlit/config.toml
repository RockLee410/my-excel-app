[theme]
# The main accent color (used for primary buttons, sliders, and active tabs)
primaryColor = "#10b981" 

# The main background of the app
backgroundColor = "#ffffff"

# The background of the sidebar and secondary elements
secondaryBackgroundColor = "#f0fdf4"

# The color of the main text
textColor = "#1f2937"

# Ensures the font feels modern and clean on both Android and iOS
font = "sans serif"
