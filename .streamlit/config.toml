[theme]
# Forces the underlying widgets to respect the dark aesthetic
base = "dark"

# Primary Accent (A rich, classic metallic Gold for buttons and highlights)
primaryColor = "#d4af37" 

# Main Background (A very deep, dark pine/forest green)
backgroundColor = "#022c22" 

# Sidebar & Card Background (A slightly lighter emerald green for contrast)
secondaryBackgroundColor = "#064e3b" 

# Text Color (A warm, soft off-white/cream that mimics old paper)
textColor = "#fef3c7" 

# Font (Changes from standard tech text to a more elegant, book-like font)
font = "serif"