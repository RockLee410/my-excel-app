[theme]
# Tells Streamlit to automatically adjust default charts and widgets to dark mode
base = "dark"

# The main accent color (swapped to a vibrant, bold red)
primaryColor = "#ef4444" 

# The main background of the app (a deep, rich slate)
backgroundColor = "#111827"

# The background of the sidebar and secondary elements
secondaryBackgroundColor = "#1f2937"

# Crisp, off-white text for high readability
textColor = "#f9fafb"

# Keeps the font feeling modern and clean
font = "sans serif"